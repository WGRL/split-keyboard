CONFIG_KEYBOARD_SIDE_LEFT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
# CONFIG_BT_DEBUG_LOG=y

CONFIG_BT_DEVICE_NAME="XIAO_BLE_L"
CONFIG_BT_MAX_CONN=2

# HID keyboard
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_MAX_POWER=250
CONFIG_SAMPLE_USBD_VID=0x2fe3


CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_SAMPLE_USBD_PID=0x0007

# Names
CONFIG_SAMPLE_USBD_MANUFACTURER="WGRL"
CONFIG_SAMPLE_USBD_PRODUCT="WGRL_KEYBOARD"
CONFIG_BT_DEVICE_NAME="WGRL_KEYBOARD"
CONFIG_BT_DEVICE_APPEARANCE=961

CONFIG_SAMPLE_USBD_SELF_POWERED=n
CONFIG_INPUT=n

CONFIG_BT_DIS=y
CONFIG_BT_BAS=y

# ble bonding (persist PC pairing across reboots)
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
# saving bonds to flash runs in these threads; the defaults (1200/1024)
# overflow and crash the keyboard right after pairing
CONFIG_BT_RX_STACK_SIZE=2560
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560
CONFIG_BT_LONG_WQ_STACK_SIZE=2048

CONFIG_BT_SMP=y
# Pairing without a PIN prompt (Just Works). GNOME cannot do the fixed-passkey
# prompt; to use it anyway (bluetoothctl) set both options below to y.
CONFIG_SAMPLE_BT_USE_AUTHENTICATION=n
CONFIG_BT_APP_PASSKEY=n
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# let a PC that forgot the keyboard pair again over its old bond
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

CONFIG_USBD_LOG_LEVEL_DBG=y

# UART debug ; destroys usb hid
CONFIG_UART_CONSOLE=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
